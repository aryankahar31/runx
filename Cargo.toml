[package]
name = "runx-launcher"
version = "0.7.2"
edition = "2021"
# zip 9.x requires 1.88; declared so older toolchains get a clear cargo error
# instead of a cryptic dependency compile failure. Documented in README/CONTRIBUTING.
rust-version = "1.88"
license = "MIT"
description = "Run any project with the exact runtime versions it declares — no global installs, no shell hooks"
repository = "https://github.com/aryankahar31/runx"
documentation = "https://github.com/aryankahar31/runx/blob/main/README.md"
readme = "README.md"
keywords = ["runtime", "version-manager", "node", "python", "launcher"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "runx"

[[bin]]
name = "runx"
path = "src/main.rs"

# cargo-binstall: fetch the prebuilt archive from the matching GitHub release.
# One override per target because release asset names are not cargo target triples.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/runx-{ target }.tar.gz"
# The archives contain the explicitly named `runx` binary at their root.
bin-dir = "runx{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/runx-linux-x64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/runx-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/runx-macos-x64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/runx-macos-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/runx-windows-x64.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "7.0"
flate2 = "1.0"
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }
xz2 = "0.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }

[dev-dependencies]
sha2 = "0.10"
