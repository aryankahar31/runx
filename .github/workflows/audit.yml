# Security audit — informational only: not a required check (ci.yml owns those)
# and not consulted by release.yml's verify-ci gate, so it can never block a
# release. Failing runs are a signal to triage, not a merge gate.
name: Audit

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
