name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt -- --check

      # Clippy was previously not run in CI, so warnings accumulated silently.
      # `-D warnings` makes any new lint a build failure.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test runx on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          project_dir="$(mktemp -d)"
          home_dir="$(mktemp -d)"
          cat > "$project_dir/runx.toml" <<'EOF'
          [runtimes]
          node = "20.11.0"

          [run]
          dev = "node --version"
          EOF

          output="$(cd "$project_dir" && HOME="$home_dir" "$GITHUB_WORKSPACE/target/release/runx" dev)"
          printf '%s\n' "$output"
          grep -F "v20.11.0" <<< "$output"

      - name: Smoke test runx on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $projectDir = Join-Path $env:RUNNER_TEMP ([System.Guid]::NewGuid().ToString())
          $homeDir = Join-Path $env:RUNNER_TEMP ([System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $projectDir, $homeDir | Out-Null

          @"
          [runtimes]
          node = "20.11.0"

          [run]
          dev = "node --version"
          "@ | Set-Content -Path (Join-Path $projectDir "runx.toml") -NoNewline

          $env:HOME = $homeDir
          $env:USERPROFILE = $homeDir
          Push-Location $projectDir
          try {
              $output = & "$env:GITHUB_WORKSPACE\target\release\runx.exe" dev
              $output | Write-Output
              if (($output -join "`n") -notmatch "v20\.11\.0") {
                  throw "Smoke test output did not contain v20.11.0"
              }
          }
          finally {
              Pop-Location
          }

  # Line/region coverage on Linux only: the unit+integration suite is
  # platform-independent for coverage purposes, and Windows/macOS already run
  # the full test job above. The threshold is set from the measured baseline
  # (~89.5% lines at the time this job was added) with headroom so routine
  # platform-specific branches cannot flap the gate.
  coverage:
    name: Coverage (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines=85

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
